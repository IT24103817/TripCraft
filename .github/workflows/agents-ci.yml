name: agents-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: agents-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents

    env:
      # No real model in CI: every test injects a FakeLLM (see agents/tests/EVALUATION.md).
      LLM_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest -q
