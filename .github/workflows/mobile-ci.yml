name: mobile-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generated *.g.dart / *.freezed.dart are committed, so no build_runner step is needed here.
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
