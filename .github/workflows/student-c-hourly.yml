name: Student C - October 2 hourly commits

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/student-c-hourly.yml'
      - 'automation/student-c-20261002/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the queue without publishing, or publish one currently due change
        required: true
        default: validate
        type: choice
        options: [validate, publish, recover]
  schedule:
    # UTC 02:30-11:30 = Sri Lanka 08:00-17:00 on October 2.
    # The script enforces the year, count, date and each change's due time.
    - cron: '30 2-11 2 10 *'
    # Retry ten minutes later. Already published slots become no-ops.
    - cron: '40 2-11 2 10 *'

permissions:
  contents: write
  actions: write

concurrency:
  group: student-c-20261002-publisher
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the reviewed queue
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test scheduling and file guards
        run: python3 -m unittest discover -s automation/student-c-20261002 -p 'test_*.py' -v
      - name: Check out Student C with its complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: IT24103079
          path: student
          fetch-depth: 0
      - name: Check out pinned shared build dependencies
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: IT24103817/TripCraft
          ref: fab245e65f4f41412c5e818dda330d2417f46c43
          path: integration
          persist-credentials: false
      - name: Install .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate or publish one due change
        env:
          MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'validate' }}
          GH_TOKEN: ${{ github.token }}
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          if [ "$MODE" = "recover" ]; then
            python3 -u automation/student-c-20261002/recover.py --student student --integration integration
          else
            python3 automation/student-c-20261002/publish.py --student student --integration integration --mode "$MODE"
          fi
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: student-c-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: integration/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
