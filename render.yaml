# Render Blueprint (https://render.com/docs/blueprint-spec). New > Blueprint > pick this repo.
# Values marked `sync: false` are left blank here and entered once in the Render dashboard — never commit them.
# Full guide: docs/DEPLOYMENT.md

services:
  - type: web
    name: tripcraft-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT                    # Render routes traffic to this port (the image listens on 8080)
        value: "8080"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL            # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: JWT_SECRET              # random, at least 32 bytes
        sync: false
      - key: JWT_ISSUER              # e.g. tripcraft-prod
        sync: false
      - key: INTERNAL_AGENT_KEY      # shared with the agent service
        sync: false
      - key: AGENT_SERVICE_URL       # where the agent service runs (see docs/DEPLOYMENT.md)
        sync: false
      - key: LLM_PROVIDER            # the Settings page's default until an Admin saves one
        value: groq
      - key: ORS_API_KEY             # OpenRouteService (optional)
        sync: false
      - key: OWM_API_KEY             # OpenWeatherMap (optional)
        sync: false
      - key: ALLOWED_ORIGINS         # the Vercel URL, comma-separated if several
        sync: false
      - key: RUN_MIGRATIONS          # "true" applies migrations and seeds on start
        sync: false
      - key: AGENT_CALLBACK_BASE_URL # where the agents post results, if not the agent's own API_BASE_URL (optional)
        sync: false
      - key: FX_FALLBACK_LKR_PER_USD # rate used (flagged stale) if the FX provider fails before any success
        value: "300"
      - key: VOUCHER_SIGNING_KEY     # v1.1: random, at least 32 bytes; signs voucher QR codes
        sync: false
      - key: CANCELLATION_CUTOFF_DAYS # v1.1: tourists may cancel until N days before the start
        value: "3"
      - key: OPERATOR_CONTACT        # v1.1: shown when cancellation is closed
        sync: false
      - key: MAILTRAP_API_TOKEN      # v1.1: Mailtrap email sandbox (tourist emails); falls back to a pickup folder
        sync: false
      - key: MAILTRAP_INBOX_ID
        sync: false
      - key: SMTP_HOST               # v1.1: optional; without it confirmation emails go to a pickup folder
        sync: false
      # UPLOADS_DIR is not set here: the image uses /app/uploads. Render's free disk is ephemeral, so passport
      # photos saved there are lost on every redeploy or restart.

  # The agent service with Groq (Ollama cannot run on the free tier). Set the API's AGENT_SERVICE_URL to
  # this service's URL. The free tier sleeps after 15 minutes: wake it before the demo (docs/DEPLOY-CHECKLIST.md).
  - type: web
    name: tripcraft-agents
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./agents/Dockerfile
    dockerContext: ./agents
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL             # see agents/README.md for why not llama-3.1-8b-instant
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY           # from console.groq.com; left blank here
        sync: false
      - key: INTERNAL_AGENT_KEY     # same value as the API's
        sync: false
      - key: API_BASE_URL           # the API's Render URL, e.g. https://tripcraft-api.onrender.com
        sync: false
      - key: NODE_TIMEOUT_SECONDS   # long enough to wait out Groq's per-minute token limit (8,000 TPM free)
        value: "90"
      - key: RATE_LIMIT_RETRIES     # 429 / 503: wait Groq's retry-after (or 2, 4, 8 s), then fail safely
        value: "3"
      - key: RATE_LIMIT_MAX_WAIT_SECONDS # a per-minute limit asks for up to 60 s; longer = a daily limit, fail at once
        value: "60"
      # Optional: LLM_PROVIDER=gemini with GEMINI_API_KEY / GEMINI_MODEL (free tier: 20 requests a day).
